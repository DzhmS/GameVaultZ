{% extends 'base.html' %}

{% block title %}
Platforms
{% endblock %}

{% block content %}
<h1 class="mb-4">Platforms</h1>

<div class="row g-4">
    {% for platform in platforms %}
        <div class="col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">
                        {{ platform.name }}
                    </h5>

                    <p class="card-text">
                        {{ platform.description|default:"No description."|truncatewords:20 }}
                    </p>

                    <a href="{% url 'platform-detail' platform.pk %}"
                       class="btn btn-outline-primary">
                        View Details
                    </a>
                </div>
            </div>
        </div>
    {% empty %}
        <p>No platforms found.</p>
    {% endfor %}
</div>
{% endblock %}
