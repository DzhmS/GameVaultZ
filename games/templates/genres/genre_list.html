{% extends 'base.html' %}

{% block title %}
Genres
{% endblock %}

{% block content %}
<h1 class="mb-4">Genres</h1>

<div class="row g-4">
    {% for genre in genres %}
        <div class="col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">
                        {{ genre.name }}
                    </h5>

                    <p class="card-text">
                        {{ genre.description|default:"No description."|truncatewords:20 }}
                    </p>

                    <a href="{% url 'genre-detail' genre.pk %}"
                       class="btn btn-outline-primary">
                        View Details
                    </a>
                </div>
            </div>
        </div>
    {% empty %}
        <p>No genres found.</p>
    {% endfor %}
</div>

{% endblock %}
